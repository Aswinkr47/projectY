           color:aliceblue

        input{

padding:10px;

<body>
    <center>
    
    <div id="box">
        <h1>Create Account</h1>
    <form>
        <div class="container">
        <label for="user" id="user">ENTER USERNAME : </label>
        <input type="text" id="user" required><br>
        <label for="pass" id="pass">ENTER PASSWORD : </label>
        <input type="password" id="pass" minlength="6"  required><br>
        <label for="number">MOBILE NUMBER : </label>
        <input type="tel" maxlength="10"  placeholder="80895 68674" id="tele"><br>
        <label for="datee">ENTER DATE OF BIRTH : </label>
        <input type="date" id="datee">
        <br><br>
        <button type="submit" id="submit">SIGN IN</button>

</div>
    </form>
